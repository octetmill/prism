name: Snapshot

# Every push to a non-main branch builds a snapshot and replaces the asset
# on the rolling "snapshot" GitHub pre-release. Stable install URL:
#
#   https://github.com/routeweave/prism/releases/download/snapshot/luci-app-prism-snapshot.apk
#
# The APK/IPK version inside the package is
# <last-v*-tag>_git<YYYYMMDDHHMMSS>-r<PKG_RELEASE>, where the timestamp is
# HEAD's own committer date in UTC.
#
# A commit COUNT was tried here first and is wrong twice over. It encodes
# distance rather than identity, so two branches the same number of commits
# past the tag produce an identical body — and since every branch publishes
# to the ONE rolling asset below, a tester moving between them can end up
# installing nothing. Worse, a count moves backwards: rebasing or squashing a
# branch turns _git5 into _git1, so the later build sorts below the installed
# one.
#
# Both faults land on opkg, not apk: `opkg install <file>` compares versions
# even for a local file and refuses ("Not downgrading package …" / "… already
# install on …"), while `apk add <file>` pins to the package's content hash
# and ignores the version entirely. 24.10 is supported, so this matters.
#
# A commit timestamp is distinct per commit and only ever advances, so the
# version body orders snapshots on its own, with no tie-breaker smuggled into
# the packaging-revision field. The body still dominates the comparison, so a
# snapshot stays bounded between the release it follows and the next one.

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Serialise snapshot builds: a newer push supersedes an in-flight one, so the
# rolling snapshot release and the moving `snapshot` tag never race.
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the rolling snapshot release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git rev-list / describe

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      # No PRISM_RELEASE here on purpose. -r<N> is the packaging revision and
      # belongs to the Makefile; snapshot ordering is carried by the commit
      # timestamp in the version body instead. See package.sh's
      # version-detection block.
      - name: Build packages
        run: .github/workflows/package.sh

      - name: Check version against apk's parser
        run: |
          BUILT=$(basename "$(ls dist/*.apk | head -n1)" .apk)
          BUILT="${BUILT#luci-app-prism-}"
          .github/workflows/version-check.sh "$BUILT"

      - name: Stage snapshot assets with stable filenames
        id: stage
        run: |
          mkdir -p snapshot
          APK_SRC=$(ls dist/*.apk | head -n1)
          IPK_SRC=$(ls dist/*.ipk | head -n1)
          BUILT_VER=$(basename "$APK_SRC" .apk | sed 's/^luci-app-prism-//')
          echo "built_version=${BUILT_VER}" >> "$GITHUB_OUTPUT"
          cp "$APK_SRC"           snapshot/luci-app-prism-snapshot.apk
          cp "${APK_SRC}.sha256"  snapshot/luci-app-prism-snapshot.apk.sha256
          cp "$IPK_SRC"           snapshot/luci-app-prism-snapshot.ipk
          cp "${IPK_SRC}.sha256"  snapshot/luci-app-prism-snapshot.ipk.sha256

      # Per-commit archive under the version-stamped filenames. The rolling
      # release asset below is overwritten by the next branch push, so this
      # is the only way back to the exact bytes a given commit produced —
      # and push-to-router.sh installs from it via `gh run download`.
      - name: Archive this build
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-prism-snapshot-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/*.ipk
            dist/*.ipk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish to rolling snapshot pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_VERSION: ${{ steps.stage.outputs.built_version }}
        run: |
          TAG="snapshot"
          NOTES_FILE=$(mktemp)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/snapshot"
          .github/workflows/release-notes.sh \
            "${DL}/luci-app-prism-snapshot.apk" \
            "${DL}/luci-app-prism-snapshot.ipk" \
            > "$NOTES_FILE" <<EOF
          Rolling snapshot — replaced on every commit to a non-main branch.

          **Built version:** \`${BUILT_VERSION}\`
          **Commit:** \`${GITHUB_SHA}\`
          **Branch:** \`${GITHUB_REF_NAME}\`
          EOF

          # The "snapshot" tag is non-semantic and moves to the current commit
          # on every build. Force-update is intentional here.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Snapshot — ${BUILT_VERSION}" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --target "${GITHUB_SHA}"
            gh release upload "$TAG" snapshot/* --clobber
          else
            gh release create "$TAG" snapshot/* \
              --title "Snapshot — ${BUILT_VERSION}" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
