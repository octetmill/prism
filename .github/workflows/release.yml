name: Release

# Releases are triggered by a v* tag, not by merges to main. The tag can be
# pushed from git (`git push origin v0.1.0`) or created together with the
# release in the GitHub UI — this workflow handles both: it creates the
# release when only the tag exists, or uploads the built packages to a
# release already created in the UI. Assets stay immutable: a re-run that
# would overwrite an existing asset fails instead of clobbering it.
#
# Tag format:
#   v0.1.0       — normal release; PKG_RELEASE defaults to 1
#   v0.1.0-r2    — packaging-only re-release of the same source (rare)

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub releases

    steps:
      - uses: actions/checkout@v4
        # No fetch-depth: 0 — PRISM_VERSION is parsed from the tag and
        # package.sh skips its git block when PRISM_VERSION is set, so
        # no commit history is consulted on the release path.

      - name: Install apk-tools
        uses: ./.github/actions/install-apk-tools

      - name: Parse tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"           # v0.1.0 or v0.1.0-r2
          STRIPPED="${TAG#v}"
          case "$STRIPPED" in
            *-r*)
              VERSION="${STRIPPED%-r*}"
              RELEASE="${STRIPPED##*-r}"
              ;;
            *)
              VERSION="$STRIPPED"
              RELEASE="1"
              ;;
          esac
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}"   >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (version=${VERSION} release=${RELEASE})"

      # The Makefile is authoritative for the version on every build path;
      # the tag is the release *decision*, not a second place to declare a
      # version. Verifying rather than overriding is what keeps the OpenWrt
      # SDK build path — which reads PKG_VERSION/PKG_RELEASE verbatim and
      # never sees PRISM_VERSION — labelled identically to what we publish.
      #
      # PKG_VERSION trails the timeline: it names the version being released
      # now, so the release commit sets it and the tag confirms it. A
      # mismatch is a mistake in one of the two, and guessing which would be
      # worse than stopping.
      - name: Verify tag matches Makefile
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          mk_var() {
            awk -F':=' -v key="$1" \
              '$1 == key { sub(/^[ \t]+/, "", $2); sub(/[ \t]+$/, "", $2); print $2; exit }' \
              Makefile
          }
          MK_VERSION=$(mk_var PKG_VERSION)
          MK_RELEASE=$(mk_var PKG_RELEASE)
          echo "tag:      version=${VERSION} release=${RELEASE}"
          echo "Makefile: version=${MK_VERSION} release=${MK_RELEASE}"
          fail=0
          [ "$MK_VERSION" = "$VERSION" ] || { echo "::error::Makefile PKG_VERSION is '${MK_VERSION}' but tag says '${VERSION}'"; fail=1; }
          [ "$MK_RELEASE" = "$RELEASE" ] || { echo "::error::Makefile PKG_RELEASE is '${MK_RELEASE}' but tag says '${RELEASE}'"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "::error::Update the Makefile to match the tag (or retag), then re-run."
            exit 1
          fi
          echo "Makefile and tag agree."

      - name: Build packages
        env:
          PRISM_VERSION: ${{ steps.ver.outputs.version }}
          PRISM_RELEASE: ${{ steps.ver.outputs.release }}
        run: .github/workflows/package.sh

      - name: Check version against apk's parser
        run: .github/workflows/version-check.sh "${{ steps.ver.outputs.version }}-r${{ steps.ver.outputs.release }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          RELEASE="${{ steps.ver.outputs.release }}"

          # Assets are uploaded under package.sh's canonical filenames. They
          # used to carry an extra -openwrt-25.12 / -openwrt-24.10 tag, which
          # asserted a compatibility the package does not have: it is noarch
          # and format-bound, not release-bound — the apk installs on any
          # apk-era OpenWrt and the ipk on any opkg-era one. The extension
          # already carries that distinction, and the notes below spell it
          # out, so the suffix said nothing true that was not already said.
          # It also had to be stripped back off by feed.sh via a hard-coded
          # literal; feed.sh still strips it for the releases that predate
          # this change, and that rule is now inert for new ones.

          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release already exists — it was created from the GitHub UI,
            # which makes the tag and the release together. Attach the built
            # packages to it. `gh release upload` without --clobber still
            # errors if an asset of the same name is already present, so a
            # genuine re-run is rejected and published bytes stay immutable.
            # The UI-authored title and notes are left untouched.
            echo "Release $TAG exists — uploading assets to it"
            gh release upload "$TAG" \
              dist/*.apk dist/*.apk.sha256 \
              dist/*.ipk dist/*.ipk.sha256
            gh release edit "$TAG" --latest
          else
            # Only the tag exists (pushed from git) — create the release.
            echo "Release $TAG does not exist — creating it"
            NOTES_FILE=$(mktemp)
            DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
            # Lead with GitHub's own "What's Changed" list — the same one the
            # UI writes into a release created there — so a tag-pushed release
            # reads like the hand-made ones, then the install instructions.
            # The endpoint needs only the tag, which is already pushed, and
            # picks the previous release to diff against. If it fails (a first
            # release with nothing to compare against, a transient API error)
            # fall back to the bare header rather than lose the install
            # commands with it.
            CHANGELOG=$(gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body 2>/dev/null) || CHANGELOG=""
            [ -n "$CHANGELOG" ] || CHANGELOG="Release $TAG"
            printf '%s\n' "$CHANGELOG" | .github/workflows/release-notes.sh \
              "${DL}/luci-app-prism-${VERSION}-r${RELEASE}.apk" \
              "${DL}/luci-app-prism_${VERSION}-r${RELEASE}_all.ipk" \
              > "$NOTES_FILE"
            gh release create "$TAG" \
              dist/*.apk dist/*.apk.sha256 \
              dist/*.ipk dist/*.ipk.sha256 \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
